# =====================================================================
# GVP mapping matrix (scope classification rules)
# =====================================================================
# Source: "GVP mapping matrix" by the team's pharmacovigilance expert.
# The AI reads the SOP title and Purpose/Objective, matches these keywords
# (case-insensitive; British/American spellings are treated the same),
# proposes a primary GVP module, and checks the procedures before finalising.
#
# Module codes must match the GVP index (I ... X, XV, XVI).
# Edit this file to change the rules; no code changes are needed.
#
# Hawkim adaptations (marked "adaptation" below) are not in the expert's
# document and should be confirmed by the expert:
#  - Rows pointing to documents that are NOT in the indexed SFDA GVP
#    (product/population-specific considerations, Module VI and IX addenda)
#    cannot be used for retrieval; they produce a "manual classification" flag.
#  - "Pregnancy prevention programme" is a risk minimisation tool (XVI.B.3.3),
#    so it is routed to Module XVI before the general "pregnancy" row.
# =====================================================================

